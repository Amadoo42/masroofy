<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masroofy | {% block title %}{% endblock %}</title>
    <style>
        :root {
            --bg-color: #050505;
            --surface-color: #121212;
            --border-color: #333333;
            --text-main: #f0f0f0;
            --text-muted: #888888;
            --accent-blood: #ff2a2a;
            --accent-hover: #cc0000;
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            text-transform: uppercase; 
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 2rem;
        }

        nav {
            border-bottom: 2px solid var(--accent-blood);
            padding: 1rem 2rem;
            background-color: var(--surface-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        nav h1 span {
            color: var(--accent-blood);
        }

        /* Group the auth items together */
        .nav-auth {
            display: flex;
            align-items: center;
            gap: 1rem; /* Space between buttons */
        }

        .username-display {
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .btn {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.2rem;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit; /* Ensures same font as body */
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s ease-in-out;
            text-decoration: none;
            display: inline-block;
            outline: none;
        }

        .btn:hover {
            border-color: var(--accent-blood);
            color: var(--accent-blood);
        }

        .btn-primary {
            background-color: var(--accent-blood);
            color: #fff;
            border-color: var(--accent-blood);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
            border-color: var(--accent-hover);
            color: #fff;
        }

        /* Specific fix for the logout form button to strip default styling */
        .btn-link {
            background: none;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" style="text-decoration: none;">
            <h1>Masroofy<span>.</span></h1>
        </a>
        
        <div class="nav-auth">
            {% if user.is_authenticated %}
                <span class="username-display">{{ user.username }}</span>
                <form method="post" action="{% url 'logout' %}" style="margin: 0;">
                    {% csrf_token %}
                    <button type="submit" class="btn">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn">Log In</a>
                <a href="{% url 'signup' %}" class="btn btn-primary">Sign Up</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
