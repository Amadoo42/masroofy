{% extends 'budget/base.html' %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
    <div class="card" id="balance-card">
        <div style="font-size: 0.8rem; color: var(--text-muted);">Remaining Balance</div>
        <div style="font-size: 2rem; font-family: var(--font-mono);">{{ remaining_balance }} EGP</div>
    </div>
    <div class="card" id="daily-card">
        <div style="font-size: 0.8rem; color: var(--text-muted);">Safe Daily Limit</div>
        <div style="font-size: 2rem; font-family: var(--font-mono);">{{ daily_limit|floatformat:2 }} EGP</div>
    </div>
</div>

<div class="card">
    <h3 style="margin-top: 0; font-size: 1rem;">Log Expense</h3>
    <form hx-post="{% url 'dashboard' %}" hx-swap="none" style="display: flex; gap: 1rem; align-items: center;" id="log-form">
        <input type="number" name="amount" id="quick-amount" class="input-dark" placeholder="0.00" min="0.01" step="0.01" required autofocus style="width: 120px;">
        <select name="category" class="input-dark">
            {% for code, label in categories %}
                <option value="{{ code }}">{{ label }}</option>
            {% endfor %}
        </select>
        <input type="text" name="note" class="input-dark" placeholder="Note (optional)" style="flex-grow: 1;">
        <button type="submit" class="btn">Commit</button>
    </form>
    <div id="toast-container" style="margin-top: 1rem; font-size: 0.85rem; color: var(--accent-primary);"></div>
</div>
{% endblock %}
