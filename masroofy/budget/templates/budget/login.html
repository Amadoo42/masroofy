{% extends 'budget/base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 bg-[#0A0A0A] rigid-border p-8 shadow-2xl relative z-10 rounded-sm w-full">
    <h2 class="font-heading text-2xl font-medium tracking-widest text-on-surface mb-8 text-center uppercase">Enter App</h2>
    
    {% if form.errors %}
        <div class="bg-error/10 border border-error p-3 text-error font-data-sm mb-6 text-center">
            ACCESS DENIED. CHECK CREDENTIALS.
        </div>
    {% endif %}

    <form method="post" class="flex flex-col gap-6" id="login-form">
        {% csrf_token %}
        {% for field in form %}
        <div class="flex flex-col gap-2">
            <label for="{{ field.id_for_label }}" class="font-label text-label text-on-surface-variant uppercase">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}
        <button type="submit" class="btn-primary text-white font-label text-lg uppercase py-3 px-6 mt-4 w-full shadow-lg hover:shadow-primary/20 transition-all">Unlock</button>
    </form>

    <div class="text-center mt-6 font-data-sm text-on-surface-variant">
        Don't have an account? <a href="{% url 'signup' %}" class="text-primary hover:underline">Sign up here</a>.
    </div>
</div>

<script>
    document.querySelectorAll('#login-form input').forEach(el => {
        if(el.type !== 'hidden') {
            el.classList.add('bg-black', 'border', 'border-[#333]', 'p-3', 'font-data-md', 'text-on-surface', 'focus:outline-none', 'focus:border-primary', 'transition-colors', 'w-full');
        }
    });
</script>
{% endblock content %}
