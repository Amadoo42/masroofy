{% extends 'budget/base.html' %}
{% block title %}Ledger{% endblock %}

{% block content %}
<div class="card" style="padding: 0;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="border-bottom: 1px solid var(--border-subtle);">
                <th style="padding: 1rem; font-size: 0.8rem; color: var(--text-muted);">Date</th>
                <th style="padding: 1rem; font-size: 0.8rem; color: var(--text-muted);">Category</th>
                <th style="padding: 1rem; font-size: 0.8rem; color: var(--text-muted);">Note</th>
                <th style="padding: 1rem; font-size: 0.8rem; color: var(--text-muted);">Amount</th>
                <th style="padding: 1rem;"></th>
            </tr>
        </thead>
        <tbody id="ledger-body">
            {% for tx in transactions %}
            <tr id="tx-row-{{ tx.id }}" style="border-bottom: 1px solid var(--border-subtle);">
                <td style="padding: 1rem; font-family: var(--font-mono); font-size: 0.85rem;">{{ tx.timestamp|date:"M d, H:i" }}</td>
                <td style="padding: 1rem; font-size: 0.85rem;">{{ tx.get_category_display }}</td>
                <td style="padding: 1rem; font-size: 0.85rem; color: var(--text-muted);">{{ tx.note|default:"-" }}</td>
                <td style="padding: 1rem; font-family: var(--font-mono); color: var(--accent-danger);">-{{ tx.amount }}</td>
                <td style="padding: 1rem; text-align: right;">
                    <button class="btn btn-danger" hx-post="{% url 'transaction_delete' tx.id %}" hx-target="#tx-row-{{ tx.id }}" hx-swap="outerHTML">X</button>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
